trigger: none
pr:
  branches:
    include: [main]
pool:
  vmImage: ubuntu-latest
stages:
  - stage: Validate
    jobs:
      - job: AppTests
        steps:
          - checkout: self
          - template: pipelines/templates/python-ci.yml
          - task: Docker@2
            displayName: Build container (no push on PR)
            inputs:
              command: build
              repository: cloudcart-api
              Dockerfile: Dockerfile
              buildContext: .
              tags: pr-$(System.PullRequest.PullRequestId)
      - job: TerraformChecks
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs: { terraformVersion: '1.9.8' }
          - script: |
              set -e
              terraform fmt -check -recursive infra
              for env in dev test prod; do
                terraform -chdir=infra/environments/$env init -backend=false
                terraform -chdir=infra/environments/$env validate
              done
            displayName: Terraform format and validate
