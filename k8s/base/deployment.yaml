apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-api
  namespace: cloudcart
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloudcart-api
  template:
    metadata:
      labels:
        app: cloudcart-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: cloudcart-api
          image: REPLACE_WITH_ACR.azurecr.io/cloudcart-api:REPLACE_WITH_TAG
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
