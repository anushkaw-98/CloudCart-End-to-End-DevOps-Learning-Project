
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-api
  namespace: cloudcart
  labels:
    app: cloudcart-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudcart-api
  template:
    metadata:
      labels:
        app: cloudcart-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: cloudcart-api
          image: REPLACE_WITH_ACR_LOGIN_SERVER/cloudcart-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: dev
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
