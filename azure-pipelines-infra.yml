
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**
      - azure-pipelines-infra.yml

pr: none

pool:
  vmImage: ubuntu-latest


parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - test
      - prod


variables:
  - name: tfVersion
    value: '1.9.8'

  - ${{ if eq(parameters.environment, 'dev') }}:
    - name: azureServiceConnection
      value: 'sc-cloudcart-dev-wif'

  - ${{ elseif eq(parameters.environment, 'test') }}:
    - name: azureServiceConnection
      value: 'sc-cloudcart-test-wif'

  - ${{ elseif eq(parameters.environment, 'prod') }}:
    - name: azureServiceConnection
      value: 'sc-cloudcart-prod-wif'




stages:
  # Stage 1: Create and publish the reviewed plan
  - stage: Plan
    displayName: Terraform Plan
    jobs:
      - job: Plan
        displayName: Generate Terraform Plan
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(tfVersion)

          - task: AzureCLI@2
            displayName: Create Terraform plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                cd "infra/environments/${{ parameters.environment }}"
                export ARM_USE_AZUREAD=true

                # Initialize the same remote backend used by Apply
                terraform init -input=false

                terraform fmt -check -recursive
                terraform validate

                # Save the exact plan that will be applied
                terraform plan -input=false -out=tfplan

                PLAN_DIR="$(Build.ArtifactStagingDirectory)/tfplan"
                mkdir -p "$PLAN_DIR"

                cp tfplan "$PLAN_DIR/tfplan"

                # Human-readable plan for review
                terraform show -no-color tfplan > "$PLAN_DIR/tfplan.txt"

          - publish: $(Build.ArtifactStagingDirectory)/tfplan
            artifact: terraform-plan
            displayName: Publish Terraform plan

  # Stage 2: Apply the exact saved plan after approval
  - stage: Apply
    displayName: Apply Approved Terraform Plan
    dependsOn: Plan
    condition: succeeded()

    jobs:
      - deployment: Apply
        displayName: Apply ${{ parameters.environment }}
        environment: cloudcart-infra-${{ parameters.environment }}

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(tfVersion)

                # Download the exact plan published by the Plan stage
                - download: current
                  artifact: terraform-plan

                - task: AzureCLI@2
                  displayName: Initialize and apply reviewed plan
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      cd "infra/environments/${{ parameters.environment }}"
                      export ARM_USE_AZUREAD=true

                      # Use the same backend configuration as the Plan stage
                      terraform init -input=false

                      PLAN_FILE="$(Pipeline.Workspace)/terraform-plan/tfplan"

                      if [ ! -f "$PLAN_FILE" ]; then
                        echo "ERROR: Published Terraform plan not found."
                        exit 1
                      fi

                      # Apply the saved plan. Do NOT run terraform plan here.
                      terraform apply -input=false "$PLAN_FILE"
