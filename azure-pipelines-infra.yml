trigger:
  branches:
    include: [main]
  paths:
    include: ['infra/**', 'azure-pipelines-infra.yml']
pr: none
pool:
  vmImage: ubuntu-latest
parameters:
  - name: environment
    displayName: Environment to plan/apply
    type: string
    default: dev
    values: [dev, test, prod]
variables:
  azureServiceConnection: 'sc-cloudcart-dev-wif'
  tfVersion: '1.9.8'

stages:
  - stage: Plan
    displayName: Terraform plan
    jobs:
      - job: Plan
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(tfVersion)
          - task: AzureCLI@2
            displayName: Init, validate, plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                cd "infra/environments/${{ parameters.environment }}"
                export ARM_USE_AZUREAD=true
                terraform init -input=false
                terraform fmt -check -recursive
                terraform validate
                terraform plan -input=false -out=tfplan
                terraform show -no-color tfplan
                mkdir -p "$(Build.ArtifactStagingDirectory)/tfplan"
                cp tfplan "$(Build.ArtifactStagingDirectory)/tfplan/tfplan"
          - publish: $(Build.ArtifactStagingDirectory)/tfplan
            artifact: terraform-plan

  - stage: Apply
    displayName: Apply Terraform (protected environment)
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: cloudcart-infra-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(tfVersion)
                - task: AzureCLI@2
                  displayName: Re-plan and apply only after approval
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      cd "infra/environments/${{ parameters.environment }}"
                      export ARM_USE_AZUREAD=true
                      terraform init -input=false
                      # Re-plan after the gate so the applied plan matches current state.
                      terraform plan -input=false -out=tfplan
                      terraform apply -input=false -auto-approve tfplan
